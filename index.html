<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Leben has moved</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://moonage.me/apps/leben">
  <meta http-equiv="refresh" content="0; url=https://moonage.me/apps/leben">
  <script>
    // Old links point at #privacy, #delete-account or #support; keep them landing on the right page.
    var h = location.hash;
    var to = 'https://moonage.me/apps/leben';
    if (h === '#privacy') to = 'https://moonage.me/apps/leben/privacy';
    else if (h === '#delete-account') to = 'https://moonage.me/apps/leben/privacy#delete-account';
    else if (h === '#support') to = 'https://moonage.me/apps/leben#support';
    location.replace(to);
  </script>
</head>
<body>
  <p>Leben has moved to <a href="https://moonage.me/apps/leben">moonage.me/apps/leben</a>.
  Privacy policy: <a href="https://moonage.me/apps/leben/privacy">moonage.me/apps/leben/privacy</a>.</p>
</body>
</html>
